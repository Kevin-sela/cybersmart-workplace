[project]
name = "cybersmart-workplace-backend"
version = "1.0.0"
description = "FastAPI backend for the CyberSmart Workplace learning app"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic==1.18.4",
  "argon2-cffi==25.1.0",
  "Authlib==1.9.1",
  "email-validator==2.3.0",
  "fastapi==0.136.3",
  "itsdangerous==2.2.0",
  "psycopg[binary]==3.2.9",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "PyJWT==2.10.1",
  "slowapi==0.1.9",
  "SQLAlchemy==2.0.50",
  "uvicorn[standard]==0.40.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mypy==2.1.0",
  "pytest==9.0.3",
  "ruff==0.14.8",
]

[tool.uv]
package = false
